name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name."
            exit 1
          fi
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing key not configured."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Rename, verify and checksum
        run: |
          apk="Duoodo-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          scripts/check-apk-privacy.sh "$apk" | tee privacy-report.txt
          sha256sum "$apk" > "$apk.sha256"
          echo "APK=$apk" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.APK }}

      - name: Release notes
        run: |
          {
            cat "docs/changelogs/$VERSION_CODE.txt" 2>/dev/null && echo
            echo "Requires Android 8.0 or later. Install the same version on both phones."
            echo
            echo "## Permission check"
            echo '```'
            cat privacy-report.txt
            echo '```'
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$APK.sha256")\`"
            echo
            echo "Signing certificate:"
            echo '```'
            apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$apksigner" verify --print-certs "$APK" | grep -m1 'SHA-256' || true
            echo '```'
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "Duoodo $GITHUB_REF_NAME" \
            --notes-file notes.md

      # The source repo can be private; the app is published from a separate public repo.
      # PUBLIC_REPO_TOKEN: fine-grained token scoped to that repo only, Contents: read & write.
      - name: Publish to public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC_REPO: ${{ vars.PUBLIC_REPO || 'dil2743/Duoodo' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PUBLIC_REPO_TOKEN not set; skipping public release."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --repo "$PUBLIC_REPO" \
            --title "Duoodo $GITHUB_REF_NAME" \
            --notes-file notes.md
